# GitHub Pages: демонстрационная сборка frontend (React + Vite) без backend.
#
# Pages раздаёт только статику, go-core здесь не запускается: сборка идёт в mock-режиме
# (VITE_USE_MOCKS=true, shared/mocks) — интерфейс целиком работает в браузере,
# данные демонстрационные и хранятся у каждого посетителя.
#
# Адрес — https://<владелец>.github.io/<репозиторий>/, поэтому base = /<репозиторий>/
# (из него же basename роутера, src/app/App.tsx). У Pages нет SPA-fallback на index.html:
# 404.html — копия index.html, чтобы прямые ссылки и F5 на внутренних страницах работали.
#
# Однократно в настройках репозитория: Settings → Pages → Source: GitHub Actions.

name: GitHub Pages (frontend)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/configure-pages@v5

      - run: npm ci

      - name: Build
        env:
          VITE_USE_MOCKS: 'true'
        run: npm run build -- --base=/${{ github.event.repository.name }}/

      - name: SPA fallback
        run: cp dist/index.html dist/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
