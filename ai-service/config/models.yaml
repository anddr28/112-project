# Профили моделей: профиль (из контракта) -> модель + лимиты.
# Контракт профилей не знает, какая модель за ними: смена 3b на 7b — правка этого файла
# (или env LLM_MODEL, который перекрывает model у ВСЕХ LLM-профилей — одна модель в памяти).
#
# Почему везде одна модель: на стенде 8 ядер / 16 ГБ две LLM в памяти не живут, Ollama
# будет свапать веса между диалогом и оценкой (десятки секунд). Разводить профили по
# разным моделям — только по итогам bench (docs/tasks/ml-research.md).
#
# timeout_s — потолок одного вызова Ollama; num_predict — потолок токенов ответа
# (для dialog_fast он же держит задержку хода диалога).
profiles:
  dialog_fast:
    model: qwen2.5:7b-instruct
    temperature: 0.4
    num_predict: 160
    num_ctx: 4096
    timeout_s: 20   # фактически режется остатком бюджета хода (DIALOG_DEADLINE_SEC)
  eval_fast:
    model: qwen2.5:7b-instruct
    temperature: 0.0
    num_predict: 700
    num_ctx: 6144
    timeout_s: 120
  eval_dialogue:
    model: qwen2.5:7b-instruct
    temperature: 0.0
    num_predict: 900
    num_ctx: 8192
    timeout_s: 180
  eval_thorough:
    model: qwen2.5:7b-instruct
    temperature: 0.0
    num_predict: 900
    num_ctx: 8192
    timeout_s: 240
  generate:
    model: qwen2.5:7b-instruct
    temperature: 0.7
    num_predict: 2600
    num_ctx: 8192
    timeout_s: 420
  stt_default:
    engine: faster_whisper
    model: small
    compute_type: int8
    beam_size: 2
  tts_default:
    engine: silero
    model: v4_ru
    voice: baya
    sample_rate: 24000
